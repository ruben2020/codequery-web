<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Git History - {{ filename }}</title>
    <style>
        {% if theme == 'light' %}
        body {
            font-family: sans-serif;
            margin: 30px;
            background-color: #ffffff;
            color: #1f2328;
        }
        a {
            color: #0969da;
            text-decoration: none;
        }
        a:hover {
            color: #0550ae;
            text-decoration: underline;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-link {
            color: #0969da;
            text-decoration: none;
        }
        .back-link:hover {
            color: #0550ae;
            text-decoration: underline;
        }
        .git-history {
            border-radius: 4px;
            border: 1px solid #d0d7de;
            background-color: #f6f8fa;
            overflow-x: auto;
        }
        .git-log {
            margin: 0;
            padding: 15px;
            color: #1f2328;
            background: transparent;
            font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .top-nav {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #d0d7de;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-nav a {
            color: #0969da;
            text-decoration: none;
            font-weight: bold;
        }
        .top-nav a:hover {
            color: #0550ae;
            text-decoration: underline;
        }
        .nav-sep {
            color: #8c959f;
        }
        .folder-bar {
            display: flex;
            align-items: center;
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 20px;
            font-family: monospace, sans-serif;
            font-size: 1rem;
            box-shadow: inset 0 1px 2px rgba(31, 35, 40, 0.06);
            overflow-x: auto;
            white-space: nowrap;
        }
        .folder-bar .folder-icon {
            margin-right: 6px;
            user-select: none;
        }
        .folder-bar a.folder-level {
            color: #0969da;
            text-decoration: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        .folder-bar a.folder-level:hover {
            background-color: #eaeef2;
            color: #0550ae;
            text-decoration: underline;
        }
        .folder-bar .folder-sep {
            color: #57606a;
            margin: 0 2px;
            user-select: none;
        }
        .folder-bar .file-level {
            color: #1f2328;
            padding: 2px 6px;
            font-weight: normal;
        }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #d0d7de;
            font-size: small;
            color: #57606a;
            text-align: center;
        }
        {% else %}
        body {
            font-family: sans-serif;
            margin: 30px;
            background-color: #0d1117;
            color: #e6edf3;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            color: #79c0ff;
            text-decoration: underline;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-link {
            color: #58a6ff;
            text-decoration: none;
        }
        .back-link:hover {
            color: #79c0ff;
            text-decoration: underline;
        }
        .git-history {
            border-radius: 4px;
            border: 1px solid #30363d;
            background-color: #161b22;
            overflow-x: auto;
        }
        .git-log {
            margin: 0;
            padding: 15px;
            color: #e6edf3;
            background: transparent;
            font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .top-nav {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-nav a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
        }
        .top-nav a:hover {
            color: #79c0ff;
            text-decoration: underline;
        }
        .nav-sep {
            color: #6e7681;
        }
        .folder-bar {
            display: flex;
            align-items: center;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 20px;
            font-family: monospace, sans-serif;
            font-size: 1rem;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
            overflow-x: auto;
            white-space: nowrap;
        }
        .folder-bar .folder-icon {
            margin-right: 6px;
            user-select: none;
        }
        .folder-bar a.folder-level {
            color: #58a6ff;
            text-decoration: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        .folder-bar a.folder-level:hover {
            background-color: #21262d;
            color: #79c0ff;
            text-decoration: underline;
        }
        .folder-bar .folder-sep {
            color: #8b949e;
            margin: 0 2px;
            user-select: none;
        }
        .folder-bar .file-level {
            color: #e6edf3;
            padding: 2px 6px;
            font-weight: normal;
        }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
            font-size: small;
            color: #8b949e;
            text-align: center;
        }
        {% endif %}
    </style>
</head>
<body class="{{ 'light-theme' if theme == 'light' else 'dark-theme' }}" data-theme="{{ theme }}">

    <div class="top-nav">
        <a href="{{ url_for('search_query') }}">Search Query</a>
        <span class="nav-sep">|</span>
        <a href="{{ url_for('browse_directory') }}">📁 File Browser</a>
        <span class="nav-sep">|</span>
        <a href="{{ url_for('file_git_history', p=current_path) }}">File Git History</a>
        <span class="nav-sep">|</span>
        <a href="{{ theme_toggle_url }}">{{ theme_toggle_label }}</a>
    </div>

    <div class="folder-bar">
        <span class="folder-icon">📁</span>
        <a href="{{ url_for('browse_directory') }}" class="folder-level">/</a>
        {% for level in folder_levels %}
            <span class="folder-sep">/</span>
            <a href="{{ url_for('browse_directory', p=level.path) }}" class="folder-level">{{ level.name }}</a>
        {% endfor %}
        <span class="folder-sep">/</span>
        <span class="file-level">{{ filename }}</span>
    </div>

    <div class="header">
        <h2>File Git History: {{ filename }}</h2>
        <div>
            <a class="back-link" href="{{ url_for('view_file', p=current_path) }}">Back to File</a>
            <span class="nav-sep">|</span>
            <a class="back-link" href="javascript:history.back()">Back to Folder</a>
        </div>
    </div>

    <div class="git-history">
        <pre class="git-log">{{ git_log }}</pre>
    </div>

    <footer class="footer">
        <small>Powered by <a href="https://github.com/ruben2020/codequery-web">codequery-web</a></small>
    </footer>

</body>
</html>
