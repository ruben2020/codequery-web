<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
        .card { border: 1px solid #e1e4e8; padding: 20px; border-radius: 6px; background-color: #fafbfc; }
        .badge { background: #28a745; color: white; padding: 3px 8px; border-radius: 3px; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>Welcome to your Backend Server</h1>
    <div class="card">
        <p><strong>Server Status:</strong> <span class="badge">{{ status }}</span></p>
        <p><strong>Stack:</strong> {{ framework }}</p>
    </div>
</body>
</html>
