<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Query - codequery-web</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #2d2d2d;
            color: #fff;
        }
        .top-nav {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        .top-nav a {
            color: #4da6ff;
            text-decoration: none;
            font-weight: bold;
        }
        .top-nav a:hover {
            color: #fff;
            text-decoration: underline;
        }
        h1, h2 {
            color: #f9f9f9;
        }
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 600px;
            background-color: #383838;
            padding: 24px;
            border-radius: 6px;
            border: 1px solid #444;
            margin-top: 15px;
        }
        .form-row {
            display: flex;
            align-items: center;
        }
        .form-row > label:first-child {
            width: 130px;
            flex-shrink: 0;
            font-weight: bold;
            color: #eee;
        }
        .form-row input[type="text"],
        .form-row select {
            flex-grow: 1;
            padding: 8px 12px;
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-row input[type="text"]:focus,
        .form-row select:focus {
            outline: none;
            border-color: #4da6ff;
        }
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }
        .form-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .form-checkbox label {
            cursor: pointer;
            color: #eee;
        }
        .form-actions {
            margin-top: 6px;
        }
        .search-btn {
            padding: 8px 24px;
            background-color: #007acc;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .search-btn:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="{{ url_for('browse_directory') }}">📁 File Browser</a>
    </div>

    <h1>Search Query</h1>

    {% include 'search_form.html' %}

</body>
</html>
