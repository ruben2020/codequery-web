<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Query - codequery-web</title>
    <style>
        {% if theme == 'light' %}
        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #1f2328;
        }
        a {
            color: #0969da;
            text-decoration: none;
        }
        a:hover {
            color: #0550ae;
            text-decoration: underline;
        }
        .top-nav {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #d0d7de;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-nav a {
            color: #0969da;
            text-decoration: none;
            font-weight: bold;
        }
        .top-nav a:hover {
            color: #0550ae;
            text-decoration: underline;
        }
        .nav-sep {
            color: #8c959f;
        }
        h1, h2 {
            color: #1f2328;
        }
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 600px;
            background-color: #f6f8fa;
            padding: 24px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            margin-top: 15px;
        }
        .form-row {
            display: flex;
            align-items: center;
        }
        .form-row > label:first-child {
            width: 130px;
            flex-shrink: 0;
            font-weight: bold;
            color: #1f2328;
        }
        .form-row input[type="text"],
        .form-row select {
            flex-grow: 1;
            padding: 8px 12px;
            background-color: #ffffff;
            color: #1f2328;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-row input[type="text"]:focus,
        .form-row select:focus {
            outline: none;
            border-color: #0969da;
        }
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }
        .form-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .form-checkbox label {
            cursor: pointer;
            color: #1f2328;
        }
        .form-actions {
            margin-top: 6px;
        }
        .search-btn {
            padding: 8px 24px;
            background-color: #0969da;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .search-btn:hover {
            background-color: #0550ae;
        }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #d0d7de;
            font-size: small;
            color: #57606a;
            text-align: center;
        }
        {% else %}
        body {
            font-family: sans-serif;
            margin: 40px;
            background-color: #0d1117;
            color: #e6edf3;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            color: #79c0ff;
            text-decoration: underline;
        }
        .top-nav {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-nav a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
        }
        .top-nav a:hover {
            color: #79c0ff;
            text-decoration: underline;
        }
        .nav-sep {
            color: #6e7681;
        }
        h1, h2 {
            color: #f0f6fc;
        }
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 600px;
            background-color: #161b22;
            padding: 24px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-top: 15px;
        }
        .form-row {
            display: flex;
            align-items: center;
        }
        .form-row > label:first-child {
            width: 130px;
            flex-shrink: 0;
            font-weight: bold;
            color: #e6edf3;
        }
        .form-row input[type="text"],
        .form-row select {
            flex-grow: 1;
            padding: 8px 12px;
            background-color: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-row input[type="text"]:focus,
        .form-row select:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }
        .form-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .form-checkbox label {
            cursor: pointer;
            color: #e6edf3;
        }
        .form-actions {
            margin-top: 6px;
        }
        .search-btn {
            padding: 8px 24px;
            background-color: #1f6feb;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .search-btn:hover {
            background-color: #388bfd;
        }
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
            font-size: small;
            color: #8b949e;
            text-align: center;
        }
        {% endif %}
    </style>
</head>
<body class="{{ 'light-theme' if theme == 'light' else 'dark-theme' }}" data-theme="{{ theme }}">

    <div class="top-nav">
        <a href="{{ url_for('browse_directory') }}">📁 File Browser</a>
        <span class="nav-sep">|</span>
        <a href="{{ theme_toggle_url }}">{{ theme_toggle_label }}</a>
    </div>

    <h1>Search Query</h1>

    {% include 'search_form.html' %}

    <footer class="footer">
        <small>Powered by <a href="https://github.com/ruben2020/codequery-web">codequery-web</a></small>
    </footer>

</body>
</html>
