<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ filename }}</title>
    <style>
        {{ pygments_css | safe }}

        body {
            font-family: sans-serif;
            margin: 30px;
            background: #2d2d2d;
            color: #fff;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-link {
            color: #4da6ff;
            text-decoration: none;
        }
        .back-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        .highlight {
            border-radius: 4px;
            border: 1px solid #444;
            overflow-x: auto;
        }
        .highlighttable {
            border-collapse: collapse;
            width: 100%;
        }
        td.linenos {
            padding: 10px 0 10px 10px;
            vertical-align: top;
            user-select: none;
            width: 1%;
            white-space: nowrap;
        }
        td.linenos pre {
            margin: 0;
            color: #777;
            text-align: right;
            border: none;
            background: transparent;
            font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.25;
        }
        td.code {
            padding: 10px;
            vertical-align: top;
            border-left: 1px solid #3a3a3a;
        }
        td.code pre {
            margin: 0;
            border: none;
            background: transparent;
            font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.25;
        }
        .symbol-link {
            color: inherit;
            text-decoration: none;
        }
        .symbol-link:hover {
            color: #4da6ff !important;
            text-decoration: underline !important;
        }
        .top-nav {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .top-nav a {
            color: #4da6ff;
            text-decoration: none;
            font-weight: bold;
        }
        .top-nav a:hover {
            color: #fff;
            text-decoration: underline;
        }
        .nav-sep {
            color: #666;
        }
        .folder-bar {
            display: flex;
            align-items: center;
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 20px;
            font-family: monospace, sans-serif;
            font-size: 1rem;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
            overflow-x: auto;
            white-space: nowrap;
        }
        .folder-bar .folder-icon {
            margin-right: 6px;
            user-select: none;
        }
        .folder-bar a.folder-level {
            color: #4da6ff;
            text-decoration: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
        .folder-bar a.folder-level:hover {
            background-color: #383838;
            color: #fff;
            text-decoration: underline;
        }
        .folder-bar .folder-sep {
            color: #777;
            margin: 0 2px;
            user-select: none;
        }
        .folder-bar .file-level {
            color: #ddd;
            padding: 2px 6px;
            font-weight: normal;
        }
        :target {
            background-color: rgba(255, 230, 0, 0.3) !important;
            display: inline-block;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="{{ url_for('search_query') }}">Search Query</a>
        <span class="nav-sep">|</span>
        <a href="{{ url_for('browse_directory') }}">📁 File Browser</a>
    </div>

    <div class="folder-bar">
        <span class="folder-icon">📁</span>
        <a href="{{ url_for('browse_directory') }}" class="folder-level">/</a>
        {% for level in folder_levels %}
            <span class="folder-sep">/</span>
            <a href="{{ url_for('browse_directory', p=level.path) }}" class="folder-level">{{ level.name }}</a>
        {% endfor %}
        <span class="folder-sep">/</span>
        <span class="file-level">{{ filename }}</span>
    </div>

    <div class="header">
        <h2>Viewing: {{ filename }}</h2>
        <a class="back-link" href="javascript:history.back()">Back to Folder</a>
    </div>

    <div class="code-viewer">
        {{ highlighted_content | safe }}
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const hash = window.location.hash;
            if (hash) {
                let el = document.querySelector(hash);
                if (!el) {
                    const num = hash.replace(/[^0-9]/g, '');
                    if (num) {
                        el = document.getElementById('line-' + num);
                    }
                }
                if (el) {
                    el.scrollIntoView({ behavior: 'auto', block: 'center' });
                    el.style.display = 'inline-block';
                    el.style.width = '100%';
                    el.style.backgroundColor = 'rgba(255, 230, 0, 0.3)';
                }
            }
        });
    </script>

</body>
</html>
