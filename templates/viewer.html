<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ filename }}</title>
    <style>
        {{ pygments_css | safe }}

        body {
            font-family: sans-serif;
            margin: 30px;
            background: #2d2d2d;
            color: #fff;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-link {
            color: #4da6ff;
            text-decoration: none;
        }
        .back-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        .highlight {
            border-radius: 4px;
            border: 1px solid #444;
            overflow-x: auto;
        }
        .highlighttable {
            border-collapse: collapse;
            width: 100%;
        }
        td.linenos {
            padding: 10px 0 10px 10px;
            vertical-align: top;
            user-select: none;
            width: 1%;
            white-space: nowrap;
        }
        td.linenos pre {
            margin: 0;
            color: #777;
            text-align: right;
            border: none;
            background: transparent;
            font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.25;
        }
        td.code {
            padding: 10px;
            vertical-align: top;
            border-left: 1px solid #3a3a3a;
        }
        td.code pre {
            margin: 0;
            border: none;
            background: transparent;
            font-family: Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
            font-size: 0.95rem;
            line-height: 1.25;
        }
        .symbol-link {
            color: inherit;
            text-decoration: none;
        }
        .symbol-link:hover {
            color: #4da6ff !important;
            text-decoration: underline !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Viewing: {{ filename }}</h2>
        <a class="back-link" href="javascript:history.back()">Back to Folder</a>
    </div>

    <div class="code-viewer">
        {{ highlighted_content | safe }}
    </div>

</body>
</html>
